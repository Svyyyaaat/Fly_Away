# Make it Compatible: Immersive Portals (Neo Voxy build) - extra settings. Read at game start.
#
# EXPERIMENTAL, off by default. In testing it barely raised FPS and made movement near a portal look
# uneven, because cheap and expensive frames alternate. true = switch it on anyway.
portalViewReuse=false
#
# When switched on: render a portal's far side only every N-th frame and redraw it from the
# stored image in between (corrected for how you turned and moved). 1 = render it every frame
# (feature off). Higher = cheaper, but things moving inside the portal update less often.
portalViewRenderInterval=2
#
# The stored image is reused only while you have moved less than this many blocks since it was
# rendered. Lower it if edges inside the portal smear while you move fast; 0 = only when standing
# still.
portalViewReuseMaxTravel=0.75
#
# The End Sea (Create Aeronautics / Simulated) draws a glow on the sea under ships. To make it, every
# ship is drawn a second time from above and the result blurred, on every frame and in every portal
# view. false = leave the glow out (ships still float; that part runs on the server and is untouched).
endSeaGlow=false
#
# Shader packs render their shadow map once more for every portal view. auto = leave that out when
# the far side is a dimension without sky light (the Nether, the End) and the pack does not use the
# shadow pass for anything else. always = render it every time, as Iris does by itself.
portalViewShadows=always
#
# EXPERIMENTAL, off by default (this replaces the older portalViewShadows line, which is no longer
# read). true = leave the shader pack's shadow pass out of portal views into dimensions without sky
# light (the Nether, the End), unless the pack uses that pass for something else.
portalViewShadowSkip=false
#
# Portal views look through the main view's camera instead of setting up a camera of their own, so
# camera mods (CameraOverhaul, Shoulder Surfing, ...) run once per frame and the view inside a portal
# turns exactly with the world around it. false = Immersive Portals' own behaviour.
portalViewSharesCamera=true
#
# Create: two shaft ends that point at each other through a portal turn together, as if the shaft
# went through. Speed, direction and stress carry over; both sides have to be loaded. The gap in
# the portal frame is filled with a drawn piece of shaft. false = off.
createRotationThroughPortals=true
#
# Create: blocks moved by a bearing or other contraption that swing through a portal are drawn on the
# other side as well (blocks only, not chests and other block entities on them). false = off.
createContraptionsThroughPortals=true
#
# Shader packs: shade a portal view only inside the portal's rectangle on screen (plus a margin
# for blur/bloom), instead of the whole screen. false = off. Portals covering more than
# portalViewScissorMaxCoverage of the screen are always drawn whole. The margin is in pixels at 1920 wide.
portalViewScissor=true
portalViewScissorMargin=48
portalViewScissorMaxCoverage=0.7
# Passes of the shader pack that must still run on the whole screen (comma separated). Solas lays its
# bloom out as tiles across the screen in composite13; other packs may need their bloom pass named here.
portalViewScissorWholePasses=composite13
#
# Epic Fight: draw the small mob spinning inside monster spawners the plain vanilla way. Epic Fight
# otherwise draws it as a full animated model every frame, which is costly. false = Epic Fight draws it.
plainSpawnerMobs=true
