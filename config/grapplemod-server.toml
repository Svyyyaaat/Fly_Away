				#Value when creating a new non-modified grappling hook
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				default_value = 0.0
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0
				#Maximum value in the grappling hook modifier (before limits upgrade)
				# Default: 90.0
				# Range: -1.0E9 ~ 1.0E9
				max = 90.0
				#Maximum value in the grappling hook modifier (after limits upgrade)
				# Default: 90.0
				# Range: -1.0E9 ~ 1.0E9
				max_upgraded = 90.0
				#Minimum value in the grappling hook modifier (before limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min = 0.0
				#Minimum value in the grappling hook modifier (after limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min_upgraded = 0.0

	#If you want the hook to interact with different blocks differently
	[grapplinghook.blocks]
		#A list of (comma-separated, ID name) blocks that the grappling hook can attach to (aka whitelist)
		grapplingBlocks = "any"
		#A list of (comma-separated, ID name) blocks that the grappling hook can't attach to (aka blacklist)
		grapplingNonBlocks = "none"
		#A list of (comma-separated, ID name) blocks that the grappling hook will break if it hits (e.g. glass)
		grappleBreakBlocks = "none"

	#More config options for grappling hooks
	[grapplinghook.other]
		#If a hook hits a mob, yank it towards the player
		hookaffectsentities = true
		#If the player somehow manages to stretch the rope past its maximum length + this value (e.g. by teleporting), the rope snaps
		# Default: 5.0
		# Range: -1.0E9 ~ 1.0E9
		rope_snap_buffer = 5.0
		#When jumping from a rope, apply at most this speed (blocks/tick)
		# Default: 1.0
		# Range: -1.0E9 ~ 1.0E9
		rope_jump_power = 1.0
		#When jumping from a rope, jump in the angle of the rope (otherwise, jump up)
		rope_jump_at_angle = false
		#Don't allow jumping from a rope if player just jumped from another rope in less than this time ago (time in seconds).
		# Default: 0.0
		# Range: -1.0E9 ~ 1.0E9
		rope_jump_cooldown_s = 0.0
		#How fast the player can climb a rope (blocks/tick)
		# Default: 0.3
		# Range: -1.0E9 ~ 1.0E9
		climb_speed = 0.3

#Options for long fall boots
[longfallboots]
	#Allow player to make long fall boots by right-clicking a grappling hook modifier block with feather falling IV diamond boots
	longfallbootsrecipe = true

#Options for the ender staff
[enderstaff]
	#Speed for ender staff (blocks/tick)
	# Default: 1.5
	# Range: -1.0E9 ~ 1.0E9
	ender_staff_strength = 1.5
	#Time it takes to rechange the ender staff (ticks)
	# Default: 100
	# Range: > 0
	ender_staff_recharge = 100

#Options for enchantments
[enchantments]

	#Options for wallrun enchantment
	[enchantments.wallrun]
		#When jumping off a wall, jump at speed upwards (blocks/tick)
		# Default: 0.7
		# Range: -1.0E9 ~ 1.0E9
		wall_jump_up = 0.7
		#When jumping off a wall, jump at speed sideways (blocks/tick)
		# Default: 0.4
		# Range: -1.0E9 ~ 1.0E9
		wall_jump_side = 0.4
		#Maximum time a player can spend wallrunning (seconds)
		# Default: 3.0
		# Range: -1.0E9 ~ 1.0E9
		max_wallrun_time = 3.0
		#Acceleration for wallrunning (blocks/tick^2)
		# Default: 0.1
		# Range: -1.0E9 ~ 1.0E9
		wallrun_speed = 0.1
		#Mamimum speed for wallrunning (blocks/tick)
		# Default: 0.7
		# Range: -1.0E9 ~ 1.0E9
		wallrun_max_speed = 0.7
		#Drag force for wallrunning (blocks/tick^2)
		# Default: 0.01
		# Range: -1.0E9 ~ 1.0E9
		wallrun_drag = 0.01
		#Mimimum speed required for wallrunning (blocks/tick)
		# Default: 0.0
		# Range: -1.0E9 ~ 1.0E9
		wallrun_min_speed = 0.0

	#Options for double jump enchantment
	[enchantments.doublejump]
		#Jump at this speed (blocks/tick)
		# Default: 0.8
		# Range: -1.0E9 ~ 1.0E9
		doublejumpforce = 0.8
		#Keep the player's vertical momentum when double jumping
		doublejump_relative_to_falling = false
		#If the player is falling faster than this speed, don't allow double jumps (blocks/tick)
		# Default: 9.9999999E7
		# Range: -1.0E9 ~ 1.0E9
		dont_doublejump_if_falling_faster_than = 9.9999999E7

	#Options for sliding enchantment
	[enchantments.slide]
		#Jump from a slide at this speed (blocks/tick)
		# Default: 0.6
		# Range: -1.0E9 ~ 1.0E9
		slidingjumpforce = 0.6
		#Drag force for wallrunning (blocks/tick^2)
		# Default: 0.006666666828095913
		# Range: -1.0E9 ~ 1.0E9
		sliding_friction = 0.006666666828095913
		#Mimumn speed required to start sliding
		# Default: 0.15
		# Range: -1.0E9 ~ 1.0E9
		sliding_min_speed = 0.15
		#Minimum speed required to keep sliding
		# Default: 0.01
		# Range: -1.0E9 ~ 1.0E9
		sliding_end_min_speed = 0.01

#Misc. options
[other]
	#If true, automatically set allow-flight=true on servers (to prevent grappling hook from occasionally being misidentified as flying)
	override_allowflight = true
	#Maximum movement speed using the movement keys while in midair (blocks/tick) (after this mod has taken over movement (from a grappling hook / wallrun / ender staff / etc.)
	# Default: 0.7
	# Range: -1.0E9 ~ 1.0E9
	airstrafe_max_speed = 0.7
	#Acceleration using movement keys while in midair (blocks/tick^2) (after this mod has taken over movement (from a grappling hook / wallrun / ender staff / etc.)
	# Default: 0.015
	# Range: -1.0E9 ~ 1.0E9
	airstrafe_acceleration = 0.015
	#Disable this mod taking over movement while in midair (after this mod has taken over movement (from a grappling hook / wallrun / ender staff / etc.) (Note: minecraft has very high air friction)
	dont_override_movement_in_air = false
