#Options for grappling hooks
[grapplinghook]

	#Customization: Default values (when creating a new hook) and available values in the grappling hook modifier
	[grapplinghook.custom]

		#Options in the Rope upgrade
		[grapplinghook.custom.rope]

			#The length of the rope
			[grapplinghook.custom.rope.maxlen]
				#Value when creating a new non-modified grappling hook
				# Default: 30.0
				# Range: -1.0E9 ~ 1.0E9
				default_value = 30.0
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0
				#Maximum value in the grappling hook modifier (before limits upgrade)
				# Default: 60.0
				# Range: -1.0E9 ~ 1.0E9
				max = 60.0
				#Maximum value in the grappling hook modifier (after limits upgrade)
				# Default: 200.0
				# Range: -1.0E9 ~ 1.0E9
				max_upgraded = 200.0
				#Minimum value in the grappling hook modifier (before limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min = 0.0
				#Minimum value in the grappling hook modifier (after limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min_upgraded = 0.0

			#Allows rope to phase through blocks
			[grapplinghook.custom.rope.phaserope]
				#Value when creating a new non-modified grappling hook
				default_value = false
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0

			#If the rope bends around a block as it is being thrown, attach at bend
			[grapplinghook.custom.rope.sticky]
				#Value when creating a new non-modified grappling hook
				default_value = false
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0

		#Options in the Hookthrower upgrade
		[grapplinghook.custom.hookthrower]

			#Gravity on hook when thrown
			[grapplinghook.custom.hookthrower.hookgravity]
				#Value when creating a new non-modified grappling hook
				# Default: 1.0
				# Range: -1.0E9 ~ 1.0E9
				default_value = 1.0
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0
				#Maximum value in the grappling hook modifier (before limits upgrade)
				# Default: 100.0
				# Range: -1.0E9 ~ 1.0E9
				max = 100.0
				#Maximum value in the grappling hook modifier (after limits upgrade)
				# Default: 100.0
				# Range: -1.0E9 ~ 1.0E9
				max_upgraded = 100.0
				#Minimum value in the grappling hook modifier (before limits upgrade)
				# Default: 1.0
				# Range: -1.0E9 ~ 1.0E9
				min = 1.0
				#Minimum value in the grappling hook modifier (after limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min_upgraded = 0.0

			#Speed of hook when thrown
			[grapplinghook.custom.hookthrower.throwspeed]
				#Value when creating a new non-modified grappling hook
				# Default: 2.0
				# Range: -1.0E9 ~ 1.0E9
				default_value = 2.0
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0
				#Maximum value in the grappling hook modifier (before limits upgrade)
				# Default: 5.0
				# Range: -1.0E9 ~ 1.0E9
				max = 5.0
				#Maximum value in the grappling hook modifier (after limits upgrade)
				# Default: 20.0
				# Range: -1.0E9 ~ 1.0E9
				max_upgraded = 20.0
				#Minimum value in the grappling hook modifier (before limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min = 0.0
				#Minimum value in the grappling hook modifier (after limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min_upgraded = 0.0

			#Before the hook is attached, crouching will stop the hook from moving farther and slowly reel it in
			[grapplinghook.custom.hookthrower.reelin]
				#Value when creating a new non-modified grappling hook
				default_value = true
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0

			#Throws the grappling hook above the crosshairs by this angle
			[grapplinghook.custom.hookthrower.verticalthrowangle]
				#Value when creating a new non-modified grappling hook
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				default_value = 0.0
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0
				#Maximum value in the grappling hook modifier (before limits upgrade)
				# Default: 45.0
				# Range: -1.0E9 ~ 1.0E9
				max = 45.0
				#Maximum value in the grappling hook modifier (after limits upgrade)
				# Default: 90.0
				# Range: -1.0E9 ~ 1.0E9
				max_upgraded = 90.0
				#Minimum value in the grappling hook modifier (before limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min = 0.0
				#Minimum value in the grappling hook modifier (after limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min_upgraded = 0.0

			#Throws the grappling hook above the crosshairs by this angle when crouching
			[grapplinghook.custom.hookthrower.sneakingverticalthrowangle]
				#Value when creating a new non-modified grappling hook
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				default_value = 0.0
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0
				#Maximum value in the grappling hook modifier (before limits upgrade)
				# Default: 45.0
				# Range: -1.0E9 ~ 1.0E9
				max = 45.0
				#Maximum value in the grappling hook modifier (after limits upgrade)
				# Default: 90.0
				# Range: -1.0E9 ~ 1.0E9
				max_upgraded = 90.0
				#Minimum value in the grappling hook modifier (before limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min = 0.0
				#Minimum value in the grappling hook modifier (after limits upgrade)
				# Default: 0.0
				# Range: -1.0E9 ~ 1.0E9
				min_upgraded = 0.0

			#When enabled, hook is only out while button/key is held down. Instead of clicking / pressing key again to detach the hook, release the button/key to detach hook.
			[grapplinghook.custom.hookthrower.detachonkeyrelease]
				#Value when creating a new non-modified grappling hook
				default_value = false
				#Is this value changeable in the grappling hook modifier? 0 = always enabled, 1 = enabled after the limits upgrade, 2 = always disabled
				# Default: 0
				# Range: 0 ~ 2
				enabled = 0

